# Exported from https://dashboard.render.com/blueprints
# Demo gratuita: API Nest + SQLite efímero + panel prestamista (static).

services:
  - type: web
    name: cartera247-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run db:generate && npm run build --workspace=@cartera247/api
    startCommand: npm run start:render --workspace=@cartera247/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./data/render.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  - type: web
    name: cartera247-web-tenant
    runtime: static
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=@cartera247/web-tenant
    staticPublishPath: apps/web-tenant/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: cartera247-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
